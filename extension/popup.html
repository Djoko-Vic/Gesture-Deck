<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GestureDeck Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .features-list {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0;
      padding-left: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: #06b6d4;
      color: #0f172a;
      font-weight: 700;
      font-size: 12px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #22d3ee;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">⚡</div>
    <div>
      <div class="title">GestureDeck</div>
      <div style="font-size: 11px; color: #64748b;">YouTube Bridge v1.0</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span style="color: #94a3b8;">Backend Status:</span>
      <span id="status-text"><span class="dot offline"></span>Checking...</span>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #cbd5e1;">Active Capabilities:</div>
    <ul class="features-list">
      <li>Pinch & Drag Visual Scrubber</li>
      <li>Site-Only Volume (No OS pollution)</li>
      <li>Peace Sign: Next Video</li>
      <li>Three Fingers: Restart / Prev</li>
    </ul>
  </div>

  <a href="http://localhost:3000" target="_blank" class="btn">Open GestureDeck Studio</a>

  <script src="popup.js"></script>
</body>
</html>
